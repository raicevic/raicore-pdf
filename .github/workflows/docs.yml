name: Docs

# Builds the documentation site (docs/, with docfx) and runs every code sample in it (docs/snippets), on pull requests
# and pushes to main that touch the docs or the libraries. The site is uploaded as the "docs-site" artifact.
# Publishing it to GitHub Pages is a separate, manual step: run this workflow by hand with "deploy" checked, once Pages
# is enabled for the repository with GitHub Actions as its source. Nothing is published before 1.0 without the
# maintainer's approval (see CONTRIBUTING.md).
on:
  pull_request:
    paths: ["docs/**", "src/**", "dotnet-tools.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "dotnet-tools.json", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run the code samples
        run: dotnet run --project docs/snippets --configuration Release -- snippets-output

      - name: Build the site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: docs/_site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
