name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # Nightly full matrix.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    # The repository is public, so Actions minutes are free: pull requests run the full matrix too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PDF validators (qpdf structure check, poppler text extraction)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      # Installs the .nupkg files into a standalone app (no project references) and runs the README samples,
      # catching missing dependencies, native assets and packaging mistakes that the unit tests cannot see.
      - name: Package smoke test
        run: dotnet run --project tests/PackageSmoke --configuration Release -- smoke-output

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: smoke-test-pdfs
          path: smoke-output/*.pdf
