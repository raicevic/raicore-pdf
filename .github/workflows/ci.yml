name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # Nightly full matrix.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    # The repository is public, so Actions minutes are free: pull requests run the full matrix too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PDF validators (qpdf structure check, poppler text extraction)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      # veraPDF (PDF/A and PDF/UA validation) runs from its pinned Docker image behind a wrapper on PATH,
      # so ExternalTools finds it like any other tool. The wrapper mounts the temp folder the tests write to.
      - name: Install veraPDF (PDF/A and PDF/UA validator)
        if: runner.os == 'Linux'
        run: |
          docker pull --quiet verapdf/cli:v1.30.3
          printf '#!/bin/sh\ntmp="${TMPDIR:-/tmp}"\nexec docker run --rm -v "$tmp:$tmp" verapdf/cli:v1.30.3 "$@"\n' | sudo tee /usr/local/bin/verapdf
          sudo chmod +x /usr/local/bin/verapdf
          verapdf --version

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      # Installs the .nupkg files into a standalone app (no project references) and runs the README samples,
      # catching missing dependencies, native assets and packaging mistakes that the unit tests cannot see.
      - name: Package smoke test
        run: dotnet run --project tests/PackageSmoke --configuration Release -- smoke-output

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: smoke-test-pdfs
          path: smoke-output/*.pdf

  # Publishes the package smoke test trimmed and with Native AOT and runs the binaries (README: "Trimming and Native
  # AOT"). Not a required check; it takes a few minutes, so it runs on pull requests too.
  aot:
    name: aot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Native AOT links with clang on Linux (Windows and macOS runners have Visual Studio and Xcode).
      - name: Install the Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts

      - name: Publish and run the package smoke test (trimmed and Native AOT)
        shell: bash
        run: tests/PackageSmoke/publish-and-run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aot-${{ matrix.os }}
          path: |
            smoke-publish/*.log
            smoke-publish/*-pdfs/*.pdf
