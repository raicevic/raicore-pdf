name: Release

# Two kinds of tags (#62; see "Releasing" in CONTRIBUTING.md):
# - v1.2.0 (or v1.2.0-rc.1) releases the core packages (RaiCore.Pdf, .Fonts, .Layout, .Html, .Razor) together. The
#   version must match CoreVersionPrefix in Directory.Build.props.
# - <PackageId>/v0.3.0, such as RaiCore.Pdf.Docx/v0.3.0, releases one package with its own version, which must match
#   the VersionPrefix in its project file.
# Nothing is released before 1.0: core tags below v1.0.0 (including 1.0.0 prereleases) are refused, and so is any
# package tag until the core has a 1.x release.
# One-time setup (see CONTRIBUTING.md): a nuget.org trusted publishing policy for this repository and the workflow
# file "release.yml" in environment "nuget", and the repository secret NUGET_USER (the nuget.org profile name).
on:
  push:
    tags: ["v*", "RaiCore.Pdf.*/v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget # Add required reviewers to this environment to approve each release by hand.
    permissions:
      contents: write # Create the GitHub release.
      id-token: write # Exchange a GitHub OIDC token for a short-lived nuget.org API key.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # The tags, to check that the core has been released before a package with its own version.

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: What the tag releases
        id: release
        run: tools/release-plan.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install PDF validators
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Build
        run: dotnet build --configuration Release -p:ReleaseTrain=${{ steps.release.outputs.train }} -p:ReleaseSuffix=${{ steps.release.outputs.suffix }}

      - name: Test
        run: dotnet test --no-build --configuration Release -p:ReleaseTrain=${{ steps.release.outputs.train }} -p:ReleaseSuffix=${{ steps.release.outputs.suffix }}

      - name: Pack
        run: |
          for project in ${{ steps.release.outputs.projects }}; do
            dotnet pack "$project" --no-build --configuration Release -p:ReleaseTrain=${{ steps.release.outputs.train }} -p:ReleaseSuffix=${{ steps.release.outputs.suffix }} --output artifacts
          done
          ls artifacts

      - name: Package smoke test
        if: steps.release.outputs.train == 'core' # A package with its own version brings its own smoke test.
        run: dotnet run --project tests/PackageSmoke --configuration Release -p:RaiCoreVersion=${{ steps.release.outputs.version }} -- smoke-output

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing a .nupkg also pushes the .snupkg next to it to the symbol server.
      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg
          --title "$GITHUB_REF_NAME"
          --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md). Packages: https://www.nuget.org/packages?q=RaiCore.Pdf"
          ${{ steps.release.outputs.prerelease == 'true' && '--prerelease' || '' }}
