<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="2"/></filter>
    <mask id="m"><rect width="100" height="100" fill="white"/></mask>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2"/></pattern>
  </defs>
  <script type="text/javascript">document.title = "x";</script>
  <rect x="10" y="10" width="80" height="80" fill="#2a2" filter="url(#shadow)" mask="url(#m)">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="20" width="60" height="60" fill="url(#dots) #fff"/>
  <foreignObject x="0" y="0" width="100" height="100"><p xmlns="http://www.w3.org/1999/xhtml">ignored</p></foreignObject>
  <textPath>ignored</textPath>
</svg>
